<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Vanilla - CDA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Ma Todo List (Vanilla JS)</h1>
        <h2>Je suis le developpeur sur la branche feature/todo-vanilla</h2>

        <!-- Formulaire d'ajout (US 01) -->
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Ajouter une nouvelle tâche..." autocomplete="off">
            <button type="submit">Ajouter</button>
        </form>

        <!-- Liste des tâches -->
        <ul id="todo-list"></ul>

        <!-- Compteur -->
        <div class="counter">
            <span id="total-counter">Total : 0</span> |
            <span id="remaining-counter">Restantes : 0</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
